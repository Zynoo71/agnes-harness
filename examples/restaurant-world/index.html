<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agnes MHS · Agnes Restaurant</title>
    <style>
      :root { --panel: rgba(22, 16, 13, 0.74); --line: rgba(226, 160, 120, 0.32); --text: #f7eee3; --dim: #cdb49a;
              --mono: ui-monospace, "SF Mono", Menlo, monospace; --amber: #ffb45c; --red: #ff6b57; --ok: #93d58e;
              --dm: #86bba6; --dm-soft: rgba(134, 187, 166, 0.55); --llm: #8ea2ff; --llm-soft: rgba(142, 162, 255, 0.55); }
      html, body { margin: 0; height: 100%; background: #17110e; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      #app canvas { display: block; }
      #brand { position: fixed; left: 14px; top: 12px; padding: 6px 12px 7px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line);
               color: var(--text); pointer-events: none; backdrop-filter: blur(6px); }
      #brand h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: 0.02em; }
      #brand p { margin: 2px 0 0; font-size: 11.5px; color: var(--dim); }
      #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 5px 12px;
             background: var(--panel); border-top: 1px solid var(--line); color: var(--text); font: 11.5px var(--mono);
             backdrop-filter: blur(6px); white-space: nowrap; overflow: hidden; }
      #bar .spacer { flex: 1; }
      #bar #status { color: var(--dim); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="brand"><h1>Agnes Restaurant</h1><p>Robots front of house and in the kitchen</p></div>
    <div id="bar">
      <span class="spacer"></span>
      <span id="status">Opening…</span>
    </div>
    <script type="module" src="dist/main.js"></script>
  </body>
</html>
